<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="board-title-bar" style="display:none"></div>
  <div id="board"></div>
  <div id="table-view" style="display:none">
    <table class="kv-table">
      <thead>
        <tr>
          <th data-col="title" data-i18n="colCard">Card</th>
          <th data-col="column" data-i18n="colColumn">Column</th>
          <th data-col="tag" data-i18n="colTag">Tag</th>
          <th data-col="assignee" data-i18n="colAssignee">Assignee</th>
          <th data-col="dueDate" data-i18n="colDueDate">Due Date</th>
          <th data-col="progress" data-i18n="colProgress">Progress</th>
          <th data-col="priority" data-i18n="colPriority">Priority</th>
          <th data-col="body" data-i18n="colDescription">Description</th>
        </tr>
      </thead>
      <tbody id="kv-tbody"></tbody>
    </table>
  </div>
  <script src="sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
