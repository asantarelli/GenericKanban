<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="board-title-bar" style="display:none"></div>
  <div id="board"></div>
  <div id="table-view" style="display:none">
    <table class="kv-table">
      <thead>
        <tr>
          <th data-col="title">Card</th>
          <th data-col="column">Column</th>
          <th data-col="tag">Tag</th>
          <th data-col="assignee">Assignee</th>
          <th data-col="dueDate">Due Date</th>
          <th data-col="progress">Progress</th>
          <th data-col="priority">Priority</th>
          <th data-col="body">Description</th>
        </tr>
      </thead>
      <tbody id="kv-tbody"></tbody>
    </table>
  </div>
  <script src="sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
